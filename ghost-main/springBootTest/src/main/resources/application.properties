spring.application.name=springBootTest
spring.profiles.active=dev

# ===== Web =====
server.port=8125

# ===== MySQL (cangyuan) =====
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cangyuan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== Jackson：下划线命名，与旧版 Python 接口字段(deity_name 等)保持一致 =====
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== Logging =====
logging.level.root=info
logging.level.com.fenglin.springboot=warn
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
