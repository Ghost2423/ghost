<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锻造神尊根基 · 沧元界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#070b16;
    --ink2:#0d1426;
    --jade:#2dd4bf;
    --jade-deep:#0f766e;
    --crimson:#ef4454;
    --gold:#e9c46a;
    --text:#e8eef7;
    --muted:#9fb0c8;
    --glass:rgba(14,22,42,.55);
    --line:rgba(45,212,191,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC",serif;
    background:var(--ink);color:var(--text);overflow:hidden;
  }
  .wrap{display:flex;height:100vh;width:100%}

  /* ===== 左侧主题视觉 ===== */
  .visual{
    position:relative;flex:1.15;
    background:
      linear-gradient(180deg,rgba(7,11,22,.10),rgba(7,11,22,.72) 70%,rgba(7,11,22,.96)),
      url("generated-images/Chinese_ink_wash_fantasy_dongh_2026-09-14T03-41-28.png") center/cover no-repeat;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:54px 56px;overflow:hidden;
  }
  .visual::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 500px at 30% 18%,rgba(45,212,191,.16),transparent 60%),
      radial-gradient(700px 520px at 82% 92%,rgba(239,68,84,.14),transparent 60%),
      repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 26px);
    animation:speed 12s linear infinite;
  }
  @keyframes speed{0%{background-position:0 0,0 0,0 0}100%{background-position:0 0,0 0,260px 0}}
  .embers{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;
    background:var(--jade);box-shadow:0 0 8px var(--jade);opacity:.0;
    animation:rise linear infinite;}
  @keyframes rise{
    0%{transform:translateY(0) scale(1);opacity:0}
    10%{opacity:.9}
    90%{opacity:.5}
    100%{transform:translateY(-105vh) scale(.4);opacity:0}
  }
  .brand{display:flex;align-items:center;gap:14px;position:relative;z-index:3}
  .seal{
    width:46px;height:46px;border-radius:12px;
    background:linear-gradient(135deg,var(--crimson),#b91c1c);
    display:grid;place-items:center;font-weight:900;color:#fff;
    box-shadow:0 0 26px rgba(239,68,84,.6);font-size:22px;
    animation:sealPulse 3s ease-in-out infinite;
  }
  @keyframes sealPulse{50%{box-shadow:0 0 40px rgba(239,68,84,.9)}}
  .brand b{font-size:20px;letter-spacing:4px;font-weight:900}
  .brand span{font-size:12px;color:var(--muted);letter-spacing:2px;display:block;margin-top:2px}

  .hero{position:relative;z-index:3;max-width:540px}
  .hero h1{
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:96px;line-height:.98;letter-spacing:12px;
    background:linear-gradient(90deg,var(--jade),#fff,var(--gold),var(--jade));
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(45,212,191,.45));
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:220% center}}
  .hero .line{height:3px;width:170px;margin:22px 0;
    background:linear-gradient(90deg,var(--jade),var(--gold),transparent);
    box-shadow:0 0 16px var(--jade);position:relative}
  .hero .line::after{content:"";position:absolute;right:-3px;top:-4px;width:11px;height:11px;
    border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold);
    animation:slash 2.4s infinite ease-in-out}
  @keyframes slash{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(10px);opacity:1}}
  .hero p{color:#c7d4e8;font-size:17px;line-height:2.1;letter-spacing:1px;
    text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .tags{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .tag{font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;
    color:var(--jade);background:rgba(45,212,191,.08);letter-spacing:1px;
    box-shadow:0 0 14px rgba(45,212,191,.12) inset}
  .foot-note{position:relative;z-index:3;font-size:12px;color:var(--muted);letter-spacing:1px}

  /* ===== 右侧注册区 ===== */
  .panel{
    flex:.85;min-width:420px;display:grid;place-items:center;
    background:
      radial-gradient(620px 620px at 120% -10%,rgba(45,212,191,.12),transparent 55%),
      linear-gradient(180deg,var(--ink2),var(--ink));
    padding:36px;position:relative;overflow:hidden;
  }
  .panel::after{content:"";position:absolute;width:560px;height:560px;border-radius:50%;
    background:conic-gradient(from 0deg,transparent,rgba(45,212,191,.18),transparent 32%,rgba(239,68,84,.16),transparent 64%);
    filter:blur(46px);animation:spin 16s linear infinite;z-index:0;opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}
  .panel::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;
    background:linear-gradient(180deg,transparent,var(--line),transparent);z-index:1}

  .card{
    width:100%;max-width:390px;background:var(--glass);
    border:1px solid rgba(255,255,255,.10);border-radius:22px;
    padding:40px 34px;backdrop-filter:blur(16px);position:relative;z-index:2;
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
    animation:cardIn .7s ease both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:23px;padding:1.5px;
    background:linear-gradient(130deg,var(--jade),transparent 42%,var(--crimson));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.7;
    animation:borderFlow 6s linear infinite;background-size:200% 200%}
  @keyframes borderFlow{to{background-position:200% 0}}

  .card .ttl{font-size:30px;font-weight:900;letter-spacing:8px;text-align:center;
    background:linear-gradient(90deg,var(--jade),#fff,var(--gold),var(--jade));
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite}
  .card .sub{color:var(--muted);font-size:13px;margin-top:8px;letter-spacing:1px;text-align:center}
  .forge{color:var(--gold);font-size:15px;margin-top:6px;letter-spacing:3px;text-align:center;
    text-shadow:0 0 18px rgba(233,196,106,.45)}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:24px 0}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}
  .control{position:relative}
  .control input{
    width:100%;padding:13px 42px 13px 14px;font-size:15px;
    background:rgba(7,11,22,.6);border:1px solid rgba(255,255,255,.12);
    border-radius:11px;color:var(--text);outline:none;transition:.2s;font-family:inherit;
  }
  .control input:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(45,212,191,.18),0 0 18px rgba(45,212,191,.25)}
  .control .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);
    color:var(--muted);cursor:pointer;user-select:none;font-size:14px}

  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 22px;font-size:13px}
  .row label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
  .row input{accent-color:var(--jade);width:15px;height:15px}
  .row a{color:var(--jade);text-decoration:none}
  .row a:hover{text-decoration:underline}

  .btn{
    width:100%;padding:13px;border:none;border-radius:11px;cursor:pointer;
    font-size:16px;font-weight:700;letter-spacing:4px;font-family:inherit;
    color:#04130f;background:linear-gradient(135deg,var(--jade),#5eead4);
    box-shadow:0 12px 30px rgba(45,212,191,.4);transition:.18s;position:relative;overflow:hidden;
  }
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);animation:sword 3s ease-in-out infinite}
  @keyframes sword{0%{left:-60%}55%,100%{left:140%}}
  .btn:hover{transform:translateY(-1px);box-shadow:0 16px 44px rgba(45,212,191,.55)}
  .btn:active{transform:translateY(0)}

  .switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted);letter-spacing:1px}
  .switch a{color:var(--jade);text-decoration:none;margin-left:4px}
  .switch a:hover{text-decoration:underline}

  /* 根基已成态 */
  .awaken{display:none;text-align:center;animation:pop .55s ease both}
  .awaken.show{display:block}
  @keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
  .awaken .halo{width:120px;height:120px;margin:6px auto 14px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,196,106,.35),transparent 70%);
    display:grid;place-items:center;font-size:46px;
    box-shadow:0 0 50px rgba(233,196,106,.5);animation:halo 2.6s ease-in-out infinite}
  @keyframes halo{50%{box-shadow:0 0 70px rgba(233,196,106,.8)}}
  .awaken .name{font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;font-size:46px;letter-spacing:8px;
    background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(233,196,106,.55))}
  .awaken .desc{color:var(--jade);margin-top:10px;letter-spacing:3px;font-size:14px}
  .awaken .reset{margin-top:22px;background:none;border:1px solid var(--line);color:var(--muted);
    padding:9px 18px;border-radius:999px;cursor:pointer;font-family:inherit;letter-spacing:2px;transition:.18s}
  .awaken .reset:hover{color:var(--jade);border-color:var(--jade)}

  .toast{position:fixed;left:50%;top:30px;transform:translateX(-50%) translateY(-20px);
    background:linear-gradient(135deg,var(--jade-deep),var(--jade));
    color:#04130f;padding:12px 22px;border-radius:12px;font-weight:700;
    letter-spacing:1px;opacity:0;pointer-events:none;transition:.3s;z-index:60;
    box-shadow:0 14px 40px rgba(45,212,191,.45)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 召唤语设置 */
  .hint{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.5px;line-height:1.7}
  .hint b{color:var(--jade)}
  .hint.err{color:var(--crimson)}
  .gen{position:absolute;right:13px;top:50%;transform:translateY(-50%);
    font-size:12px;color:var(--jade);cursor:pointer;user-select:none;
    border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    background:rgba(45,212,191,.08);transition:.15s;letter-spacing:1px}
  .gen:hover{background:rgba(45,212,191,.18);box-shadow:0 0 14px rgba(45,212,191,.25)}
  .gen:active{transform:translateY(-50%) scale(.95)}

  /* 验证码（神纹） */
  .captcha{margin:4px 0 20px}
  .captcha .cap-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}
  .captcha .cap-row{display:flex;align-items:center;gap:10px}
  .captcha .code{font-family:"ZCOOL XiaoWei",monospace;font-size:23px;letter-spacing:7px;
    padding:10px 16px;border-radius:11px;color:#04130f;font-weight:900;min-width:118px;text-align:center;
    background:linear-gradient(135deg,var(--jade),#5eead4);
    box-shadow:0 8px 22px rgba(45,212,191,.35);user-select:none;cursor:pointer;
    position:relative;overflow:hidden;transition:.18s}
  .captcha .code:hover{filter:brightness(1.06)}
  .captcha .code::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 5px)}
  .captcha .refresh{background:none;border:1px solid var(--line);color:var(--jade);
    border-radius:9px;padding:9px 12px;cursor:pointer;font-size:13px;transition:.15s;white-space:nowrap}
  .captcha .refresh:hover{background:rgba(45,212,191,.12)}
  .captcha .cap-input{flex:1;min-width:0;padding:13px 14px;font-size:15px;letter-spacing:5px;
    background:rgba(7,11,22,.6);border:1px solid rgba(255,255,255,.12);border-radius:11px;
    color:var(--text);outline:none;font-family:inherit;text-transform:uppercase}
  .captcha .cap-input:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(45,212,191,.18)}
  .captcha .cap-input.err{border-color:var(--crimson);box-shadow:0 0 0 3px rgba(239,68,84,.18)}

  /* 神尊显现详情 */
  .awaken .myth{color:var(--muted);font-size:12.5px;margin:16px auto 0;max-width:312px;
    line-height:1.95;letter-spacing:.5px;border-top:1px solid var(--line);padding-top:14px}

  @media(max-width:880px){
    .visual{display:none}
    .panel{flex:1;min-width:0}
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 左侧视觉 -->
    <section class="visual">
      <div class="embers" id="embers"></div>
      <div class="brand">
        <div class="seal">沧</div>
        <div><b>沧元图</b><span>CANG YUAN TU · 元界</span></div>
      </div>
      <div class="hero">
        <h1>沧元图</h1>
        <div class="line"></div>
        <p>元界动荡，妖魔横行。<br>执剑入元图，护一城烟火。<br>锻造神尊根基，开启斩妖征途。</p>
        <div class="tags">
          <span class="tag">水墨仙侠</span>
          <span class="tag">剑气除妖</span>
          <span class="tag">孟川 · 柳七月</span>
          <span class="tag">腾讯视频国漫</span>
        </div>
      </div>
      <div class="foot-note">© 沧元图主题注册演示 · 仅作展示用途，非官方站点</div>
    </section>

    <!-- 右侧注册 -->
    <section class="panel">
      <form class="card" id="regForm" autocomplete="off">
        <div class="ttl">神尊殿</div>
        <div class="sub">凝元塑身，铸就不灭神格</div>
        <div class="forge">锻造神尊根基</div>
        <div class="divider"></div>

        <!-- 注册表单主体 -->
        <div id="formBody">
          <div class="field">
            <label for="region">地域</label>
            <div class="control">
              <input id="region" type="text" placeholder="请输入所属地域" />
            </div>
          </div>

          <div class="field">
            <label for="spell">召唤语设置（8–16 字）</label>
            <div class="control">
              <input id="spell" type="text" maxlength="16" placeholder="依地域古神之意，自拟召唤语" />
              <span class="gen" id="genSpell" title="引古神之语">引古神</span>
            </div>
            <div class="hint" id="spellHint">以所属地域觉醒之上古神尊为原型，召唤语需 8–16 字，且须含神尊之名；可点击「引古神」自动取语。</div>
          </div>

          <div class="row">
            <label><input type="checkbox" id="agree" /> 立下心魔誓约（用户协议）</label>
          </div>

          <div class="captcha">
            <label class="cap-label">神纹验真（验证码自动刷新）</label>
            <div class="cap-row">
              <span class="code" id="capCode" title="点击刷新神纹">AAAA</span>
              <button class="refresh" type="button" id="capRefresh" title="刷新验证码">↻ 换纹</button>
              <input class="cap-input" id="capInput" type="text" maxlength="4" placeholder="输入神纹" autocomplete="off" />
            </div>
            <div class="hint" id="capHint">点击神纹或「换纹」可手动刷新；神纹每 30 秒自行更迭，须与显示一致方可锻造。</div>
          </div>

          <button class="btn" type="submit">锻造神尊根基</button>

          <div class="switch">已有根基？<a href="index.html">返回觉醒 ›</a></div>
        </div>

        <!-- 根基已成态 -->
        <div class="awaken" id="awaken">
          <div class="halo">⚡</div>
          <div class="name" id="awakenName">神尊根基已成</div>
          <div class="desc" id="nameLine"></div>
          <div class="desc" id="spellLine"></div>
          <div class="myth" id="mythLine"></div>
          <button class="reset" type="button" id="toLogin">前往觉醒</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const $ = s => document.querySelector(s);

  const toast = (msg) => {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  };

  // 流光粒子
  (function(){
    const box = $("#embers");
    const colors = ["#2dd4bf","#e9c46a","#ef4454","#5eead4","#ffffff"];
    for(let i=0;i<26;i++){
      const e=document.createElement("i");
      e.style.left=Math.random()*100+"%";
      e.style.background=colors[i%colors.length];
      e.style.boxShadow="0 0 8px "+colors[i%colors.length];
      e.style.animationDuration=(7+Math.random()*8)+"s";
      e.style.animationDelay=(-Math.random()*10)+"s";
      const s=2+Math.random()*3; e.style.width=s+"px"; e.style.height=s+"px";
      box.appendChild(e);
    }
  })();

  // ===== 上古神话神尊原型库（依据地域关键词觉醒）=====
  const MYTHS = [
    { kw:["盘","混沌","原","元","洪"], name:"盘古",     story:"开天辟祖，清浊自分，撑天地于洪荒。", spell:"盘古开天，清浊自分" },
    { kw:["女","土","造","冀","人"],   name:"女娲",     story:"抟土造人，炼石补天，庇佑苍生。",     spell:"女娲炼石，以补苍天" },
    { kw:["伏","卦","河","洛","陇"],   name:"伏羲",     story:"演八卦而定四时，启文明之始。",       spell:"伏羲演卦，统御八荒" },
    { kw:["神","草","谷","楚","农"],   name:"神农",     story:"尝百草、播五谷，惠泽万民。",         spell:"神农尝草，惠泽苍生" },
    { kw:["黄","轩","冀","涿","中"],   name:"黄帝",     story:"中央天帝，战蚩尤而一统寰宇。",       spell:"黄帝临世，万灵归心" },
    { kw:["炎","火","姜","南"],         name:"炎帝",     story:"火德之帝，教民耕织。",             spell:"炎帝司火，燎原照世" },
    { kw:["祝","融","火","南","楚"],   name:"祝融",     story:"南方火神，秉烈焰焚尽邪祟。",         spell:"祝融秉火，焚尽邪祟" },
    { kw:["共","工","水","北","洪"],   name:"共工",     story:"怒触不周，天倾西北。",             spell:"共工怒涛，倾覆不周" },
    { kw:["后","土","地","坤","厚"],   name:"后土",     story:"大地之母，厚载万物。",             spell:"后土承地，厚载万物" },
    { kw:["东","海","太","一","皇"],   name:"东皇太一", story:"九歌所载上古天帝，统御东方。",       spell:"东皇太一，统御八荒" },
    { kw:["玄","战","兵","女"],         name:"九天玄女", story:"授兵符战法，破阵千里。",           spell:"九天玄女临，授符破阵" },
    { kw:["烛","钟","极","北","龙"],   name:"烛龙",     story:"衔烛而照幽都，睁眼为昼。",         spell:"烛龙衔烛，昼夜由心" },
    { kw:["木","春","句","芒","东"],   name:"句芒",     story:"东方木神，司春而草木同苏。",         spell:"句芒司春，草木同苏" },
    { kw:["日","弓","羿","夏","后"],   name:"后羿",     story:"弯弓射日，拯民于酷旱。",           spell:"后羿弯弓，九日俱沉" },
    { kw:["刑","战","勇","戚","常"],   name:"刑天",     story:"断首犹舞干戚，虽殁犹战。",         spell:"刑天舞戚，虽殁犹战" },
    { kw:["西","昆","瑶","母"],         name:"西王母",   story:"昆仑之主，瑶池生辉。",             spell:"西王母临，瑶池生辉" }
  ];

  const TITLES = ["真君","天君","道尊","元君","星君","上仙","灵尊","神君"];
  const rnd = arr => arr[Math.floor(Math.random()*arr.length)];

  // 依据地域匹配上古神话神尊原型
  function pickMyth(region){
    for(const m of MYTHS){ if(m.kw.some(k => region.includes(k))) return m; }
    let h = 0; for(const c of region) h = (h*31 + c.charCodeAt(0)) >>> 0;
    return MYTHS[h % MYTHS.length];
  }

  // 锻造神尊相（上古神话原型 + 封号，3–9 字）
  function forgeName(region){
    const m = pickMyth(region);
    return (m.name + rnd(TITLES)).slice(0,9);
  }

  // ===== 验证码（神纹）：自动刷新 =====
  const CAP_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let capCode = "";
  function genCaptcha(){
    let s = "";
    for(let i=0;i<4;i++) s += CAP_CHARS[Math.floor(Math.random()*CAP_CHARS.length)];
    capCode = s;
    $("#capCode").textContent = s;
  }
  genCaptcha();
  $("#capRefresh").addEventListener("click", genCaptcha);
  $("#capCode").addEventListener("click", genCaptcha);
  setInterval(genCaptcha, 30000); // 每 30 秒自行更迭

  // 引古神之语：按地域神尊自动取 8–16 字召唤语
  $("#genSpell").addEventListener("click", () => {
    const region = $("#region").value.trim();
    const m = pickMyth(region || "中");
    $("#spell").value = m.spell;
    $("#spellHint").classList.remove("err");
    $("#spellHint").innerHTML = '已依 <b>' + m.name + '</b> 古神之意引语，可改写（8–16 字）。';
    $("#spell").focus();
  });

  // 注册锻造
  $("#regForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const region = $("#region").value.trim();
    const spell  = $("#spell").value.trim();
    const cap    = $("#capInput").value.trim().toUpperCase();

    if (!region) return toast("请填入所属地域");
    if (!$("#agree").checked) return toast("请先立下心魔誓约");

    const m = pickMyth(region);
    const acc = forgeName(region);

    const len = [...spell].length;
    if (!len) return toast("请设置召唤语");
    if (len < 8 || len > 16){
      $("#spellHint").classList.add("err");
      $("#spellHint").textContent = "召唤语须为 8–16 字，当前 " + len + " 字。";
      return toast("召唤语须为 8–16 字");
    }
    // 召唤语须呼应所觉醒之上古神尊
    if (!spell.includes(m.name)){
      $("#spellHint").classList.add("err");
      $("#spellHint").textContent = "召唤语须呼应神尊「" + m.name + "」之名（含其名，8–16 字）。";
      return toast("召唤语须含神尊之名");
    }
    $("#spellHint").classList.remove("err");

    if (cap !== capCode){
      $("#capInput").classList.add("err");
      toast("神纹验真未过，请重新输入");
      genCaptcha(); $("#capInput").value = "";
      return;
    }
    $("#capInput").classList.remove("err");

    // 派生根基数据
    const payload = {
      region,
      deity_name: acc,
      myth_name: m.name,
      spell,
      myth_story: m.story,
      agreed: $("#agree").checked ? 1 : 0
    };

    // 本地登记（离线兜底 / 即时觉醒）
    try {
      localStorage.setItem("cangyuan_avatar", JSON.stringify({
        name: acc, spell, region, myth: m.name, story: m.story
      }));
    } catch(e){}

    // 显现真实觉醒神尊
    $("#formBody").style.display = "none";
    $("#awakenName").textContent = "神尊根基已成";
    $("#nameLine").textContent = "觉醒神尊 · " + acc;
    $("#spellLine").textContent = "你的召唤语 · " + spell;
    $("#mythLine").textContent = m.name + "：" + m.story;
    $("#awaken").classList.add("show");

    // 写入 MySQL 元界数据库（异步，不阻塞显现）
    fetch("/api/forge", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(r => r.json()).then(d => {
      if (d.ok) toast("神尊根基已锻造 · 已录入元界数据库");
      else toast("根基已成，数据库：" + (d.msg || "写入失败"));
    }).catch(() => toast("根基已成（本地已存，数据库暂不可达）"));
  });

  // 前往觉醒（返回登录）
  $("#toLogin").addEventListener("click", () => {
    window.location.href = "index.html";
  });
</script>
</body>
</html>
